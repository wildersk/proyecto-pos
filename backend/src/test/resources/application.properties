spring.application.name=proyecto-pos-backend

# Los tests usan H2 en memoria para no depender de PostgreSQL
spring.datasource.url=jdbc:h2:mem:pos_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

pos.jwt.secret=
pos.jwt.expiration=8h
pos.cors.allowed-origins=*

# Los tests crean sus propios usuarios, así que la siembra inicial debe quedar fuera
pos.seed.enabled=false
