spring.application.name=proyecto-pos-backend

# PostgreSQL (backend/docker-compose.yml lo publica en el puerto 5433)
spring.datasource.url=${POS_DB_URL:jdbc:postgresql://localhost:5433/pos_db}
spring.datasource.username=${POS_DB_USERNAME:pos_user}
spring.datasource.password=${POS_DB_PASSWORD:pos_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad (JWT). Si POS_JWT_SECRET no está definida se genera una clave aleatoria al arrancar
# (los tokens dejan de ser válidos tras reiniciar). Debe tener al menos 32 caracteres.
pos.jwt.secret=${POS_JWT_SECRET:}
pos.jwt.expiration=8h
pos.cors.allowed-origins=${POS_CORS_ALLOWED_ORIGINS:*}

# Siembra inicial: si la tabla usuarios está vacía al arrancar, se crean los usuarios
# de prueba (administrador1 + etapa1..etapa5) con esta contraseña. Ponlo en false
# para desactivarla. Ver config/DataSeeder.java
pos.seed.enabled=${POS_SEED_ENABLED:true}
pos.seed.password=${POS_SEED_PASSWORD:Password123!}
